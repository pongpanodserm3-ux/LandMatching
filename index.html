<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Matching - คุยเสียงกับ AI หาบ้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl text-center border border-slate-700">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">🎙️ Land Matching AI with backend</h1>
            <p class="text-slate-400 text-sm mt-1">ผู้ช่วยเสียงค้นหาบ้าน และประเมินสินเชื่อ</p>
        </div>

        <!-- Visualizer & Status -->
        <div class="my-8 flex flex-col items-center justify-center">
            <div id="avatarCircle" class="w-32 h-32 rounded-full bg-slate-700 border-4 border-emerald-500 flex items-center justify-center text-5xl shadow-lg transition-all duration-300">
                🤖
            </div>
            <p id="statusText" class="mt-4 text-sm font-medium text-slate-300">กดปุ่มด้านล่างเพื่อเริ่ม สนทนาด้วยเสียง</p>
        </div>

        <!-- Control Button -->
        <button id="toggleBtn" onclick="toggleVoiceSession()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg">
            <span id="btnIcon">🎙️</span>
            <span id="btnText">เริ่มคุยกับ AI</span>
        </button>

        <!-- Result Container -->
        <div id="resultArea" class="mt-8 text-left hidden">
            <h2 class="text-md font-bold text-emerald-400 mb-3 border-b border-slate-700 pb-2">🏡 รายการบ้านที่แนะนำสำหรับคุณ</h2>
            <div id="propertyList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
            </div>
        </div>
    </div>

    <script>
        const BACKEND_WS_URL = "wss://land-matching-backend.onrender.com";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7uTBwJDuyoV4bSVEAEuwG6EqAIR2GZNYz7qKT6jGnr6irNAzqWqr5z211jD1lkTw/exec";

        let isSessionActive = false;
        let isSetupReady = false;
        let webSocket = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let audioOutputContext = null;
        let nextPlayTime = 0;

        async function toggleVoiceSession() {
            if (!isSessionActive) {
                await startVoiceSession();
            } else {
                stopVoiceSession();
            }
        }

        async function startVoiceSession() {
            const btn = document.getElementById('toggleBtn');
            const btnText = document.getElementById('btnText');
            const avatar = document.getElementById('avatarCircle');
            const statusText = document.getElementById('statusText');

            try {
                isSetupReady = false;
                statusText.innerText = "กำลังเชื่อมต่อกับ AI...";

                // ปลดล็อกการเล่นเสียงเมื่อผู้ใช้กดปุ่ม
                audioOutputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                if (audioOutputContext.state === 'suspended') {
                    await audioOutputContext.resume();
                }
                nextPlayTime = audioOutputContext.currentTime;

                webSocket = new WebSocket(BACKEND_WS_URL);

                webSocket.onopen = () => {
                    const setupData = {
                        setup: {
                            model: "models/gemini-2.0-flash-exp",
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: {
                                    voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                                }
                            },
                            systemInstruction: {
                                parts: [{
                                    text: `คุณคือ AI ผู้ช่วยอสังหาริมทรัพย์ของ Land Matching
                                    หน้าที่ของคุณคือ พูดทักทายผู้ใช้เป็นภาษาไทยทันทีเมื่อเริ่มการสนทนา เช่น "สวัสดีครับ Land Matching AI ยินดีให้บริการครับ กำลังมองหาบ้านแถวไหนอยู่ครับ?" 
                                    จากนั้นสอบถามข้อมูลผู้ใช้ทีละข้ออย่างเป็นกันเอง:
                                    1. สอบถามความต้องการ (ซื้อ/ขาย/ซ่อม)
                                    2. สอบถามทำเลที่ต้องการ (เช่น เขตใน กทม.), สิ่งอำนวยความสะดวก
                                    3. สอบถามสถานะการเงิน (อาชีพ, รายได้/เดือน, รายจ่าย/เดือน, ภาระหนี้สิน, เครดิตบูโร, ซื้อสดหรือกู้ผ่อน)
                                    
                                    เมื่อได้ข้อมูลครบถ้วนแล้ว ให้คุณทำการประมวลผล แล้วตอบกลับด้วยโครงสร้าง JSON ท้ายสุดในรูปแบบนี้เท่านั้น:
                                    {
                                      "isFinished": true,
                                      "userData": {
                                        "demandType": "ซื้อ",
                                        "location": "เขตลาดพร้าว",
                                        "amenities": "มีสระว่ายน้ำ",
                                        "familyType": "ครอบครัว 3 คน",
                                        "career": "พนักงานเอกชน",
                                        "income": "50000",
                                        "expense": "20000",
                                        "debts": "ไม่มี",
                                        "creditBureaux": "ปกติ",
                                        "paymentType": "กู้แบงก์",
                                        "loanPeriod": "30"
                                      },
                                      "criteria": {
                                        "province": "กทม",
                                        "district": "ลาดพร้าว",
                                        "propertyType": "บ้าน"
                                      }
                                    }`
                                }]
                            }
                        }
                    };
                    webSocket.send(JSON.stringify(setupData));
                    initMicrophone();

                    isSessionActive = true;
                    btnText.innerText = "วางสาย / จบการสนทนา";
                    btn.className = "w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg";
                    avatar.classList.add('pulse-animation', 'border-rose-500');
                    avatar.classList.remove('border-emerald-500');
                };

                webSocket.onmessage = async (event) => {
                    try {
                        let response;
                        if (event.data instanceof Blob) {
                            const text = await event.data.text();
                            response = JSON.parse(text);
                        } else {
                            response = JSON.parse(event.data);
                        }
                        
                        if (response.setupComplete) {
                            isSetupReady = true;
                            statusText.innerText = "🟢 พร้อมแล้ว! ลองพูดคุยกับ AI ได้เลยครับ";
                            return;
                        }

                        const parts = response.serverContent?.modelTurn?.parts;
                        if (parts) {
                            for (let part of parts) {
                                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/")) {
                                    statusText.innerText = "🔊 AI กำลังตอบกลับ...";
                                    playPCMData(part.inlineData.data);
                                }
                                if (part.text) {
                                    try {
                                        const jsonMatch = part.text.match(/\{[\s\S]*\}/);
                                        if (jsonMatch) {
                                            const resultData = JSON.parse(jsonMatch[0]);
                                            if (resultData.isFinished) {
                                                sendDataToGAS(resultData.userData, resultData.criteria);
                                            }
                                        }
                                    } catch (e) { }
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Error parsing message:", e);
                    }
                };

                webSocket.onerror = (err) => {
                    console.error("WebSocket Error:", err);
                    statusText.innerText = "❌ การเชื่อมต่อผิดพลาด";
                };

                webSocket.onclose = (event) => {
                    console.log("WebSocket Closed Code:", event.code, "Reason:", event.reason);
                    stopVoiceSession();
                };

            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ ไม่สามารถเข้าถึงไมโครโฟนได้";
            }
        }

        async function initMicrophone() {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            source.connect(processor);
            processor.connect(audioContext.destination);

            processor.onaudioprocess = (e) => {
                if (!isSessionActive || !isSetupReady || !webSocket || webSocket.readyState !== WebSocket.OPEN) return;
                
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = convertFloat32ToPCM16(inputData);
                const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));

                webSocket.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [
                            {
                                mimeType: "audio/pcm",
                                data: base64Audio
                            }
                        ]
                    }
                }));
            };
        }

        function convertFloat32ToPCM16(buffer) {
            let l = buffer.length;
            let buf = new Int16Array(l);
            while (l--) {
                buf[l] = Math.max(-1, Math.min(1, buffer[l])) * 0x7FFF;
            }
            return buf;
        }

        function playPCMData(base64Audio) {
            if (!audioOutputContext) return;

            const rawBinary = atob(base64Audio);
            const len = rawBinary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = rawBinary.charCodeAt(i);
            }

            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);

            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = audioOutputContext.createBuffer(1, float32Array.length, 24000);
            buffer.getChannelData(0).set(float32Array);

            const source = audioOutputContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioOutputContext.destination);

            if (nextPlayTime < audioOutputContext.currentTime) {
                nextPlayTime = audioOutputContext.currentTime;
            }

            source.start(nextPlayTime);
            nextPlayTime += buffer.duration;
        }

        function stopVoiceSession() {
            isSessionActive = false;
            isSetupReady = false;
            if (webSocket) webSocket.close();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            if (audioOutputContext) audioOutputContext.close();

            const btn = document.getElementById('toggleBtn');
            const btnText = document.getElementById('btnText');
            const avatar = document.getElementById('avatarCircle');
            const statusText = document.getElementById('statusText');

            btnText.innerText = "เริ่มคุยกับ AI";
            btn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg";
            avatar.classList.remove('pulse-animation', 'border-rose-500');
            avatar.classList.add('border-emerald-500');
            statusText.innerText = "กดปุ่มด้านล่างเพื่อเริ่ม สนทนาด้วยเสียง";
        }

        async function sendDataToGAS(userData, criteria) {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "💾 กำลังบันทึกข้อมูลและค้นหาบ้าน...";

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'saveUserAndSearch',
                        userData: userData,
                        criteria: criteria
                    })
                });

                const data = await res.json();
                if (data.status === "success") {
                    displayResults(data.results);
                    statusText.innerText = `✅ บันทึกสำเร็จ! พบบ้าน ${data.results.length} รายการ`;
                }
            } catch (err) {
                console.error("Error sending to GAS:", err);
                statusText.innerText = "❌ บันทึกข้อมูลไม่สำเร็จ";
            }
        }

        function displayResults(properties) {
            const resultArea = document.getElementById('resultArea');
            const propertyList = document.getElementById('propertyList');
            resultArea.classList.remove('hidden');
            propertyList.innerHTML = '';

            if (!properties || properties.length === 0) {
                propertyList.innerHTML = '<p class="text-slate-400 text-sm">ไม่พบอสังหาฯ ที่ตรงเงื่อนไขในขณะนี้</p>';
                return;
            }

            properties.forEach(item => {
                propertyList.innerHTML += `
                    <div class="bg-slate-700/60 p-3 rounded-xl border border-slate-600 text-sm flex justify-between items-center">
                        <div>
                            <p class="font-bold text-emerald-300">${item.propertyType} - ${item.project || 'ไม่ระบุโครงการ'}</p>
                            <p class="text-xs text-slate-300">📍 เขต${item.district} ${item.province}</p>
                            <p class="text-xs font-semibold text-rose-400 mt-0.5">💰 ${item.price} บาท</p>
                        </div>
                        <a href="${item.url}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg transition-all shrink-0 ml-2">ดูรายละเอียด</a>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
