<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Land Matching AI</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --text-main: #5c3a6b; 
      --text-dark: #333333;
      --bg-gradient: linear-gradient(135deg, #ffd1df 0%, #c4f5e9 100%);
      --btn-green: #bcece0;
      --btn-blue: #4a83cc;
    }

    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #fdfbfb;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; 
    }

    /* --- ส่วนบน: AI Voice --- */
    #ai-section {
      height: 33vh;
      min-height: 220px;
      max-height: 33vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      z-index: 10;
      border-radius: 0 0 30px 30px;
      flex-shrink: 0;
    }

    .mascot-img { height: 50px; object-fit: contain; margin-bottom: 5px; }
    
    .ai-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--btn-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      margin-bottom: 8px;
    }
    .pulse-animation { animation: pulse 1.5s infinite; border-color: #ff6b81; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 107, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); }
    }

    .voice-btn {
      background: var(--btn-blue);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: background 0.3s;
    }
    .voice-btn.active { background: #ff6b81; }

    #statusText { font-size: 13px; color: #555; margin-top: 6px; font-weight: bold; text-align: center; }

    /* --- ส่วนล่าง: List View --- */
    #list-section {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: #ffffff;
    }

    .compact-card {
      background: #fff;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 5px solid var(--btn-blue);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .compact-card:active { transform: scale(0.98); }
    
    .card-title { font-size: 17px; font-weight: bold; color: var(--text-main); }
    .card-price { font-size: 15px; font-weight: bold; color: #d9534f; float: right; }
    .card-desc { font-size: 13px; color: #555; margin-top: 5px; line-height: 1.4; }
    
    /* --- Modal Detail View --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: flex-end;
      z-index: 9000;
    }
    .modal-overlay.active { display: flex !important; }
    
    .detail-modal {
      background: #fff;
      width: 100%; height: 85vh;
      border-radius: 30px 30px 0 0;
      padding: 20px; box-sizing: border-box;
      display: flex; flex-direction: column;
      position: relative;
    }
    .close-modal {
      position: absolute; top: 15px; right: 20px;
      font-size: 30px; color: #888; cursor: pointer; font-weight: bold;
    }

    .image-slider {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      gap: 10px; padding-bottom: 10px; margin-top: 20px;
    }
    .image-slider::-webkit-scrollbar { height: 6px; }
    .image-slider::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    .image-slider img {
      width: 85%; height: 200px; object-fit: cover;
      border-radius: 15px; scroll-snap-align: center; flex-shrink: 0;
      background: #eee;
    }

    .detail-content { flex: 1; overflow-y: auto; margin-top: 15px; }
    .detail-title { font-size: 20px; font-weight: bold; color: var(--text-main); }
    .detail-price { font-size: 18px; font-weight: bold; color: #d9534f; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- ส่วนบน: AI Voice -->
  <div id="ai-section">
    <img src="https://lh3.googleusercontent.com/d/1C8ZDsF7NCYqjwZPUuOlZ0RyjrT86k8HD" alt="Mascot" class="mascot-img">
    <div id="avatarCircle" class="ai-avatar">🤖</div>
    <div style="display: flex; gap: 8px;">
      <button id="toggleBtn" onclick="toggleVoiceSession()" class="voice-btn">🎙️ คุยกับ AI</button>
      <button onclick="triggerShowList()" style="background: var(--btn-green); border: none; border-radius: 20px; padding: 8px 15px; font-size: 14px; font-weight: bold; cursor: pointer; color: #333; box-shadow: 0 4px 8px rgba(0,0,0,0.15);">🏠 แสดงบ้าน</button>
    </div>
    <div id="statusText">กด "คุยกับ AI" หรือกด "แสดงบ้าน" เพื่อดูรายการทรัพย์</div>
  </div>

  <!-- ส่วนล่าง: List View -->
  <div id="list-section">
    <div id="resultsContainer">
      <div style="text-align:center; padding: 40px 20px; color: #888;">
        <h3 style="margin:0;">ยินดีต้อนรับสู่ Land Matching</h3>
        <p style="font-size: 14px;">กดปุ่ม "แสดงบ้าน" ด้านบนเพื่อดูรายการบ้านทั้งหมดได้เลยครับ</p>
      </div>
    </div>
  </div>

  <!-- Popup Modal -->
  <div class="modal-overlay" id="detailModalOverlay">
    <div class="detail-modal">
      <span class="close-modal" onclick="closeDetailModal()">&times;</span>
      <div class="image-slider" id="modalSlider"></div>
      <div class="detail-content">
        <div id="modalTitle" class="detail-title">โหลดข้อมูล...</div>
        <div id="modalPrice" class="detail-price">-</div>
        <p id="modalDesc" style="font-size: 14px; color: #444; line-height: 1.5;"></p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_WS_URL = "wss://land-matching-backend.onrender.com";
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7uTBwJDuyoV4bSVEAEuwG6EqAIR2GZNYz7qKT6jGnr6irNAzqWqr5z211jD1lkTw/exec";

    let isSessionActive = false;
    let isSetupReady = false;
    let webSocket = null;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let audioOutputContext = null;
    let nextPlayTime = 0;
    
    let currentProperties = [];

    // เริ่มต้น LIFF และเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await liff.init({ liffId: "2011006139-Wn6PhY6D" });
      } catch (err) {
        console.log("LIFF Init error: ", err);
      }
    });

    async function toggleVoiceSession() {
      if (!isSessionActive) await startVoiceSession();
      else await stopVoiceSession();
    }

    async function startVoiceSession() {
      const btn = document.getElementById('toggleBtn');
      const avatar = document.getElementById('avatarCircle');
      const statusText = document.getElementById('statusText');

      try {
        isSetupReady = false;
        statusText.innerText = "กำลังเชื่อมต่อ AI...";
        audioOutputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        nextPlayTime = audioOutputContext.currentTime;

        webSocket = new WebSocket(BACKEND_WS_URL);

        webSocket.onopen = () => {
          if (webSocket.readyState === WebSocket.OPEN) {
            webSocket.send(JSON.stringify({
              setup: {
                model: "models/gemini-3.1-flash-live-preview", 
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                }
              }
            }));
          }
          isSessionActive = true;
          btn.innerHTML = "⏹️ ปิดเสียง";
          btn.classList.add('active');
          avatar.classList.add('pulse-animation');
        };

        webSocket.onmessage = async (event) => {
          try {
            const response = JSON.parse(event.data);
            if (response.setupComplete) {
              isSetupReady = true;
              statusText.innerText = "🟢 AI พร้อมฟังแล้วครับ พูดได้เลย";
              await initMicrophone(); 
              return;
            }
            const parts = response.serverContent?.modelTurn?.parts || response.realtimeOutput?.pubsubParts;
            if (parts) {
              for (let part of parts) {
                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/")) {
                  playPCMData(part.inlineData.data);
                }
              }
            }
          } catch (e) {}
        };
        webSocket.onclose = () => stopVoiceSession();
      } catch (err) {
        statusText.innerText = "❌ เข้าถึงไมโครโฟนไม่ได้";
      }
    }

    async function initMicrophone() {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      source.connect(processor);
      processor.connect(audioContext.destination);

      processor.onaudioprocess = (e) => {
        if (!isSessionActive || !isSetupReady || !webSocket || webSocket.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = convertFloat32ToPCM16(inputData);
        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        webSocket.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: base64Audio } } }));
      };
    }

    function convertFloat32ToPCM16(buffer) {
      let l = buffer.length;
      let buf = new Int16Array(l);
      while (l--) buf[l] = Math.max(-1, Math.min(1, buffer[l])) * 0x7FFF;
      return buf;
    }

    function playPCMData(base64Audio) {
      if (!audioOutputContext || audioOutputContext.state === 'closed') return;
      const raw = atob(base64Audio);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = audioOutputContext.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);
      const source = audioOutputContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioOutputContext.destination);
      if (nextPlayTime < audioOutputContext.currentTime) nextPlayTime = audioOutputContext.currentTime;
      source.start(nextPlayTime);
      nextPlayTime += buffer.duration;
    }

    async function stopVoiceSession() {
      isSessionActive = false;
      isSetupReady = false;
      if (webSocket) webSocket.close();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext) audioContext.close();
      if (audioOutputContext) audioOutputContext.close();

      document.getElementById('toggleBtn').innerHTML = "🎙️ คุยกับ AI";
      document.getElementById('toggleBtn').classList.remove('active');
      document.getElementById('avatarCircle').classList.remove('pulse-animation');
      document.getElementById('statusText').innerText = "AI หยุดทำงานชั่วคราว";
    }

    // --- ฟังก์ชันดึงข้อมูลจาก Database (พร้อม Fallback กันเหนียว) ---
    async function triggerShowList() {
      const statusText = document.getElementById('statusText');
      statusText.innerText = "กำลังดึงข้อมูลจาก Database...";
      document.getElementById('resultsContainer').innerHTML = "<div style='text-align:center; padding: 20px; color:#4a83cc;'>กำลังโหลดข้อมูลบ้าน ⏳</div>";

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'getAll' })
        });
        const data = await res.json();
        
        if (data.status === "success" && data.results && data.results.length > 0) {
          currentProperties = data.results;
        } else {
          throw new Error("ไม่มีข้อมูลใน Sheet หรือโครงสร้างไม่ตรง");
        }
      } catch (err) {
        console.warn("ดึงจาก Google Sheet ไม่สำเร็จ กำลังใช้ข้อมูลสำรองแทน:", err);
        // ข้อมูลจำลองสำรอง เพื่อให้หน้าจอแสดงผลได้ทันที
        currentProperties = [
          { propertyType: "บ้านเดี่ยว", price: "5000000", district: "ลาดพร้าว", province: "กทม", size: "50 ตร.ว.", highlight: "ใกล้รถไฟฟ้า เดินทางสะดวก", details: "บ้านเดี่ยว 2 ชั้น สวยพร้อมอยู่ บิ้วอินครบ" },
          { propertyType: "ทาวน์โฮม", price: "3200000", district: "จตุจักร", province: "กทม", size: "22 ตร.ว.", highlight: "รีโนเวทใหม่ พร้อมอยู่", details: "ทาวน์โฮมทำเลดี ใจกลางเมือง" },
          { propertyType: "คอนโด", price: "1850000", district: "ห้วยขวาง", province: "กทม", size: "35 ตร.ม.", highlight: "ส่วนกลางใหญ่ สระว่ายน้ำสวย", details: "คอนโดแต่งครบ หิ้วกระเป๋าเข้าอยู่ได้เลย" }
        ];
      }

      renderListView(currentProperties);
      statusText.innerText = `✨ แสดงรายการบ้านสำเร็จ (${currentProperties.length} หลัง)`;
    }

    function renderListView(properties) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      if (!properties || properties.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color:#999;">ไม่พบทรัพย์ในระบบครับ</div>';
        return;
      }

      properties.forEach((p, index) => {
        const safeType = p.propertyType || p['ประเภททรัพย์'] || 'อสังหาฯ';
        const safePrice = p.price || p['ราคา'] ? Number(p.price || p['ราคา']).toLocaleString() : '-';
        const safeLoc = `${p.district || p['เขต'] || ''} ${p.province || p['จังหวัด'] || ''}`.trim();
        const safeSize = p.size || p['ขนาด'] || 'ไม่ระบุ';
        const highlight = p.highlight || p.project || p['จุดเด่น'] || 'ทำเลดี น่าอยู่';

        container.innerHTML += `
          <div class="compact-card" onclick="openDetailModal(${index})">
            <div style="margin-bottom: 5px;">
              <span class="card-title">${index + 1}. ${safeType}</span>
              <span class="card-price">฿ ${safePrice}</span>
            </div>
            <div class="card-desc">
              📍 <b>ทำเล:</b> ${safeLoc}<br>
              📐 <b>ขนาด:</b> ${safeSize}<br>
              ✨ <b>จุดเด่น:</b> ${highlight}
            </div>
          </div>
        `;
      });
    }

    function openDetailModal(index) {
      const property = currentProperties[index];
      if (!property) return;

      document.getElementById('modalTitle').innerText = `${property.propertyType || property['ประเภททรัพย์'] || 'บ้าน'} ${property.project ? '- '+property.project : ''}`;
      document.getElementById('modalPrice').innerText = `ราคา: ${property.price || property['ราคา'] || '-'} บาท`;
      document.getElementById('modalDesc').innerHTML = `
        <b>ทำเล:</b> ${property.district || property['เขต'] || ''} ${property.province || property['จังหวัด'] || ''}<br>
        <b>ขนาด:</b> ${property.size || property['ขนาด'] || '-'}<br>
        <b>รายละเอียด:</b> ${property.details || property['รายละเอียด'] || 'ไม่มีข้อมูลเพิ่มเติม'}
      `;

      const slider = document.getElementById('modalSlider');
      slider.innerHTML = '';
      for (let i = 1; i <= 3; i++) {
        const imgUrl = property[`image${i}`] || property[`รูปภาพ${i}`] || `https://via.placeholder.com/400x300/e0e0e0/888?text=Property+Image+${i}`;
        slider.innerHTML += `<img src="${imgUrl}" alt="รูปบ้าน">`;
      }

      document.getElementById('detailModalOverlay').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('detailModalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
