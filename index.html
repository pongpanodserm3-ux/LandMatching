<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Matching - คุยเสียงกับ AI หาบ้าน</title>
    <!-- ใช้ Tailwind CSS Minified Production Build แทน Play CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
    <style>
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-3xl p-6 shadow-2xl text-center border border-gray-700">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-green-400">🎙️ Land Matching AI</h1>
            <p class="text-gray-400 text-sm mt-1">ผู้ช่วยเสียงค้นหาบ้าน และประเมินสินเชื่อ</p>
        </div>

        <!-- Visualizer & Status -->
        <div class="my-6 flex flex-col items-center justify-center">
            <div id="avatarCircle" class="w-28 h-28 rounded-full bg-gray-700 border-4 border-green-500 flex items-center justify-center text-5xl shadow-lg transition-all duration-300 mb-4">
                🤖
            </div>
            
            <div class="w-full bg-black border-2 border-yellow-400 border-opacity-50 rounded-2xl p-4 shadow-inner">
                <p class="text-xs text-gray-400 mb-1 font-semibold uppercase tracking-wider">สถานะระบบ</p>
                <p id="statusText" class="text-lg font-extrabold text-yellow-300 leading-snug">
                    กดปุ่มด้านล่างเพื่อเริ่มสนทนา
                </p>
            </div>
        </div>

        <!-- Control Button -->
        <button id="toggleBtn" onclick="toggleVoiceSession()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg">
            <span id="btnIcon">🎙️</span>
            <span id="btnText">เริ่มคุยกับ AI</span>
        </button>

        <!-- Result Container -->
        <div id="resultArea" class="mt-6 text-left hidden">
            <h2 class="text-md font-bold text-green-400 mb-3 border-b border-gray-700 pb-2">🏡 รายการบ้านที่แนะนำสำหรับคุณ</h2>
            <div id="propertyList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
            </div>
        </div>
    </div>

    <script>
        const BACKEND_WS_URL = "wss://land-matching-backend.onrender.com";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7uTBwJDuyoV4bSVEAEuwG6EqAIR2GZNYz7qKT6jGnr6irNAzqWqr5z211jD1lkTw/exec";

        let isSessionActive = false;
        let isSetupReady = false;
        let webSocket = null;
        let audioContext = null;
        let mediaStream = null;
        let workletNode = null;
        let audioOutputContext = null;
        let nextPlayTime = 0;

        async function toggleVoiceSession() {
            if (!isSessionActive) {
                await startVoiceSession();
            } else {
                stopVoiceSession();
            }
        }

        async function startVoiceSession() {
            const btn = document.getElementById('toggleBtn');
            const btnText = document.getElementById('btnText');
            const avatar = document.getElementById('avatarCircle');

            try {
                isSetupReady = false;
                updateStatus("🟡 กำลังเชื่อมต่อ Server...", "text-yellow-300", "border-yellow-400 border-opacity-50");

                if (!audioOutputContext || audioOutputContext.state === 'closed') {
                    audioOutputContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                }
                if (audioOutputContext.state === 'suspended') {
                    await audioOutputContext.resume();
                }
                nextPlayTime = audioOutputContext.currentTime;

                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });

                webSocket = new WebSocket(BACKEND_WS_URL);

                webSocket.onopen = () => {
                    updateStatus("🟡 กำลังส่งการตั้งค่า AI...", "text-yellow-300", "border-yellow-400 border-opacity-50");
                    const setupData = {
                        setup: {
                            model: "models/gemini-2.0-flash-exp",
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: {
                                    voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                                }
                            },
                            systemInstruction: {
                                parts: [{
                                    text: `คุณคือ AI ผู้ช่วยอสังหาริมทรัพย์ของ Land Matching
                                    ทำหน้าที่พูดคุยเป็นภาษาไทย ถามข้อมูลทีละข้ออย่างเป็นกันเองเกี่ยวกับทำเล งบประมาณ และสถานะการเงินเพื่อหาบ้านที่เหมาะสม`
                                }]
                            }
                        }
                    };
                    webSocket.send(JSON.stringify(setupData));

                    isSessionActive = true;
                    btnText.innerText = "วางสาย / จบการสนทนา";
                    btn.className = "w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg";
                    avatar.classList.add('pulse-animation', 'border-red-500');
                    avatar.classList.remove('border-green-500');
                };

                webSocket.onmessage = async (event) => {
                    try {
                        let response;
                        if (event.data instanceof Blob) {
                            const text = await event.data.text();
                            response = JSON.parse(text);
                        } else {
                            response = JSON.parse(event.data);
                        }
                        
                        if (response.setupComplete) {
                            isSetupReady = true;
                            updateStatus("🟢 พร้อมแล้ว! ลองพูดใส่ไมค์ได้เลยครับ", "text-green-400", "border-green-500");
                            await initMicrophoneStream();
                            return;
                        }

                        const parts = response.serverContent?.modelTurn?.parts;
                        if (parts) {
                            for (let part of parts) {
                                if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/")) {
                                    updateStatus("🔊 AI กำลังพูดตอบกลับ...", "text-blue-300", "border-blue-400");
                                    playPCMData(part.inlineData.data);
                                }
                                if (part.text) {
                                    try {
                                        const jsonMatch = part.text.match(/\{[\s\S]*\}/);
                                        if (jsonMatch) {
                                            const resultData = JSON.parse(jsonMatch[0]);
                                            if (resultData.isFinished) {
                                                sendDataToGAS(resultData.userData, resultData.criteria);
                                            }
                                        }
                                    } catch (e) { }
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Error parsing message:", e);
                    }
                };

                webSocket.onerror = (err) => {
                    console.error("WebSocket Error:", err);
                    updateStatus("❌ การเชื่อมต่อผิดพลาด", "text-red-400", "border-red-500");
                };

                webSocket.onclose = (event) => {
                    console.log("WebSocket Closed Code:", event.code, "Reason:", event.reason);
                    stopVoiceSession();
                };

            } catch (err) {
                console.error(err);
                updateStatus("❌ ไม่สามารถเข้าถึงไมโครโฟนได้", "text-red-400", "border-red-500");
            }
        }

        async function initMicrophoneStream() {
            if (!mediaStream) return;

            if (!audioContext || audioContext.state === 'closed') {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            }

            // ใช้ AudioWorklet ในรูปแบบ Inline Blob เพื่อแทนที่ ScriptProcessorNode
            const workletCode = `
                class RecorderProcessor extends AudioWorkletProcessor {
                    process(inputs) {
                        const input = inputs[0];
                        if (input && input.length > 0) {
                            const channelData = input[0];
                            this.port.postMessage(channelData);
                        }
                        return true;
                    }
                }
                registerProcessor('recorder-processor', RecorderProcessor);
            `;
            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);

            await audioContext.audioWorklet.addModule(workletUrl);
            const source = audioContext.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioContext, 'recorder-processor');

            workletNode.port.onmessage = (e) => {
                if (!isSessionActive || !isSetupReady || !webSocket || webSocket.readyState !== WebSocket.OPEN) return;

                const inputData = e.data;
                const pcm16 = convertFloat32ToPCM16(inputData);
                
                let binary = '';
                const bytes = new Uint8Array(pcm16.buffer);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64Audio = btoa(binary);

                webSocket.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [
                            {
                                mimeType: "audio/pcm",
                                data: base64Audio
                            }
                        ]
                    }
                }));
            };

            source.connect(workletNode);
            workletNode.connect(audioContext.destination);
        }

        function convertFloat32ToPCM16(buffer) {
            let l = buffer.length;
            let buf = new Int16Array(l);
            while (l--) {
                buf[l] = Math.max(-1, Math.min(1, buffer[l])) * 0x7FFF;
            }
            return buf;
        }

        function playPCMData(base64Audio) {
            if (!audioOutputContext || audioOutputContext.state === 'closed') return;

            const rawBinary = atob(base64Audio);
            const len = rawBinary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = rawBinary.charCodeAt(i);
            }

            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);

            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = audioOutputContext.createBuffer(1, float32Array.length, 24000);
            buffer.getChannelData(0).set(float32Array);

            const source = audioOutputContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioOutputContext.destination);

            if (nextPlayTime < audioOutputContext.currentTime) {
                nextPlayTime = audioOutputContext.currentTime;
            }

            source.start(nextPlayTime);
            nextPlayTime += buffer.duration;
        }

        function stopVoiceSession() {
            isSessionActive = false;
            isSetupReady = false;
            
            if (webSocket && (webSocket.readyState === WebSocket.OPEN || webSocket.readyState === WebSocket.CONNECTING)) {
                webSocket.close();
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            if (workletNode) {
                workletNode.disconnect();
                workletNode = null;
            }

            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
            if (audioOutputContext && audioOutputContext.state !== 'closed') {
                audioOutputContext.close().catch(() => {});
            }

            const btn = document.getElementById('toggleBtn');
            const btnText = document.getElementById('btnText');
            const avatar = document.getElementById('avatarCircle');

            btnText.innerText = "เริ่มคุยกับ AI";
            btn.className = "w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg";
            avatar.classList.remove('pulse-animation', 'border-red-500');
            avatar.classList.add('border-green-500');
            updateStatus("กดปุ่มด้านล่างเพื่อเริ่มสนทนา", "text-yellow-300", "border-yellow-400 border-opacity-50");
        }

        function updateStatus(text, textColorClass, borderColorClass) {
            const statusText = document.getElementById('statusText');
            const statusBox = statusText.parentElement;
            
            statusText.innerText = text;
            statusText.className = `text-lg font-extrabold leading-snug ${textColorClass}`;
            statusBox.className = `w-full bg-black border-2 rounded-2xl p-4 shadow-inner transition-all duration-300 ${borderColorClass}`;
        }

        async function sendDataToGAS(userData, criteria) {
            updateStatus("💾 กำลังค้นหาบ้านที่เหมาะสม...", "text-blue-300", "border-blue-400");

            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: 'saveUserAndSearch',
                        userData: userData,
                        criteria: criteria
                    })
                });

                const data = await res.json();
                if (data.status === "success") {
                    displayResults(data.results);
                    updateStatus(`✅ บันทึกสำเร็จ! พบบ้าน ${data.results.length} รายการ`, "text-green-400", "border-green-500");
                }
            } catch (err) {
                console.error("Error sending to GAS:", err);
                updateStatus("❌ บันทึกข้อมูลไม่สำเร็จ", "text-red-400", "border-red-500");
            }
        }

        function displayResults(properties) {
            const resultArea = document.getElementById('resultArea');
            const propertyList = document.getElementById('propertyList');
            resultArea.classList.remove('hidden');
            propertyList.innerHTML = '';

            if (!properties || properties.length === 0) {
                propertyList.innerHTML = '<p class="text-gray-400 text-sm">ไม่พบอสังหาฯ ที่ตรงเงื่อนไขในขณะนี้</p>';
                return;
            }

            properties.forEach(item => {
                propertyList.innerHTML += `
                    <div class="bg-gray-700 bg-opacity-60 p-3 rounded-xl border border-gray-600 text-sm flex justify-between items-center">
                        <div>
                            <p class="font-bold text-green-300">${item.propertyType} - ${item.project || 'ไม่ระบุโครงการ'}</p>
                            <p class="text-xs text-gray-300">📍 เขต${item.district} ${item.province}</p>
                            <p class="text-xs font-semibold text-red-400 mt-0.5">💰 ${item.price} บาท</p>
                        </div>
                        <a href="${item.url}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg transition-all shrink-0 ml-2">ดูรายละเอียด</a>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
